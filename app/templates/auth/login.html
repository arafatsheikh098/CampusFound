{% extends "base.html" %}
{% block title %}{{ t("auth.login_title") }}{% endblock %}
{% block content %}
<section class="card">
  <h2>{{ t("auth.login_title") }}</h2>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>{{ t("auth.identifier") }} <input name="identifier" required></label>
    <label>{{ t("auth.password") }} <input name="password" type="password" required></label>
    <div class="row" style="margin-top: 12px;">
      <button class="btn" type="submit">{{ t("site.login") }}</button>
      <a class="btn secondary" href="/signup">{{ t("site.signup") }}</a>
      <a class="btn secondary" href="/recovery">{{ t("auth.recovery_link") }}</a>
    </div>
  </form>
</section>
{% endblock %}
