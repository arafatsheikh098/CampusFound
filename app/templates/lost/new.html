{% extends "base.html" %}
{% block title %}{{ t("lost.new_title") }}{% endblock %}
{% block content %}
<section class="card">
  <h2>{{ t("lost.new_title") }}</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/lost">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      <span>{{ t("lost.category_label") }}</span>
      <select name="category_id" required>
        <option value="">—</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if form.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>{{ t("lost.place_label") }}</span>
      <select name="place_id" required>
        <option value="">—</option>
        {% for p in places %}
          <option value="{{ p.id }}" {% if form.place_id == p.id %}selected{% endif %}>{{ p.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>{{ t("lost.date_lost") }}</span>
      <input type="date" name="date_lost" required value="{{ form.date_lost or '' }}">
    </label>
    <label>
      <span>{{ t("lost.description") }}</span>
      <textarea name="description" maxlength="300" required>{{ form.description or '' }}</textarea>
    </label>
    <label>
      <span>{{ t("lost.private_note") }}</span>
      <textarea name="private_note" maxlength="300">{{ form.private_note or '' }}</textarea>
    </label>
    <button class="btn primary" type="submit">{{ t("lost.submit") }}</button>
    <a class="btn" href="/lost/mine">{{ t("site.cancel") }}</a>
  </form>
</section>
{% endblock %}
