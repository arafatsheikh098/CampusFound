name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusfound
          POSTGRES_PASSWORD: campusfound
          POSTGRES_DB: campusfound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusfound -d campusfound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: development
      SECRET_KEY: ci-secret-key-not-for-prod-ci-secret-key-not-for-prod
      DATABASE_URL: postgresql+psycopg://campusfound:campusfound@localhost:5432/campusfound
      TRUSTED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrate
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: Migrate down
        run: alembic downgrade base
